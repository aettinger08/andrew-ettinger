<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfbfa"><title>My Quotes · Study Companion</title><style>:root{--bg:#fbfbfa;--ink:#252525;--muted:#777;--line:#e7e7e3;--blue:#2f6f9f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:10;background:#fbfbfaf4;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:54px;padding:8px 14px}.back{border:0;background:none;color:var(--blue);font-size:16px;padding:8px 4px;cursor:pointer}.title{margin-left:10px;font-weight:600;font-size:17px}.wrap{max-width:760px;margin:auto;padding:22px 18px 70px}.hero h1{font:34px/1.1 Georgia,"Times New Roman",serif;margin:0 0 7px}.hero p,.meta{color:var(--muted);font-size:13px}.search{position:sticky;top:55px;background:var(--bg);padding:14px 0 12px;z-index:5}.search input,.search select{width:100%;padding:12px 13px;border:1px solid #d8d8d3;border-radius:10px;background:#fff;font-size:16px}.search select{margin-top:8px}.quote{padding:20px 0;border-top:1px solid var(--line)}.topic{font-size:12px;color:var(--blue);font-weight:700;margin-bottom:8px}.text{white-space:pre-wrap;font:18px/1.55 Georgia,"Times New Roman",serif}.source{font-size:12px;color:var(--muted);margin-top:10px}.source a{color:var(--blue);text-decoration:none}.empty{padding:30px 0;color:var(--muted);font-size:14px}.more{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--blue);font-weight:600}</style></head><body><header class="top"><button class="back" onclick="history.back()">‹ Study Companion</button><div class="title">My Quotes</div></header><main class="wrap"><div class="hero"><h1>My Quotes</h1><p id="summary">Loading quote library…</p></div><div class="search"><input id="q" type="search" placeholder="Search quotes, people, scriptures, topics…" autocomplete="off"><select id="category"><option value="">All quote collections</option></select></div><div id="results"></div><button id="more" class="more" hidden>Show more</button></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://qgkexntrqccusjzxlmyg.supabase.co','sb_publishable_fxGyeKwo2QfovWpKSfMiQw_w5N2yeYF');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let limit=40,timer;async function cats(){const{data}=await sb.from('quote_library').select('sheet_category').order('sheet_category');const a=[...new Set((data||[]).map(x=>x.sheet_category).filter(Boolean))];category.innerHTML='<option value="">All quote collections</option>'+a.map(x=>`<option>${esc(x)}</option>`).join('')}async function load(){results.innerHTML='<div class="empty">Searching…</div>';const{data,error}=await sb.rpc('search_quote_library',{search_text:q.value.trim()||null,category_filter:category.value||null,result_limit:limit});if(error){results.innerHTML='<div class="empty">Quote library could not be reached.</div>';return}const rows=data||[];summary.textContent=`${rows.length}${rows.length===limit?'+':''} matching entries · 23 quote collections`;results.innerHTML=rows.length?rows.map(r=>`<article class="quote"><div class="topic">${esc(r.sheet_category)}${r.topic?' · '+esc(r.topic):''}</div><div class="text">${esc(r.quote_text)}</div><div class="source">${r.source_url?`<a href="${esc(r.source_url)}" target="_blank">Open source →</a>`:`${esc(r.sheet_name)}`}</div></article>`).join(''):'<div class="empty">No matching quotes.</div>';more.hidden=rows.length<limit}q.oninput=()=>{clearTimeout(timer);limit=40;timer=setTimeout(load,250)};category.onchange=()=>{limit=40;load()};more.onclick=()=>{limit=Math.min(limit+40,200);load()};cats();load();</script></body></html>
