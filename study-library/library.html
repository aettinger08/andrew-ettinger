<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfbfa"><title>My Study Library</title><style>:root{--bg:#fbfbfa;--ink:#252525;--muted:#777;--line:#e7e7e3;--blue:#2f6f9f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:5;background:#fbfbfaf4;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:54px;padding:8px 14px}.top a,.actions a{color:var(--blue);text-decoration:none}.title{margin-left:14px;font-weight:600}.spacer{flex:1}.wrap{max-width:820px;margin:auto;padding:24px 22px 70px}h1{font:34px/1.1 Georgia,serif;margin:0 0 8px}.sub,.stats,.signed{font-size:12px;color:var(--muted)}.sub{font-size:14px;margin-bottom:22px}.controls{display:grid;grid-template-columns:1fr 170px;gap:10px;margin-bottom:18px}.controls input,.controls select,.auth input{width:100%;padding:11px 12px;border:1px solid #d8d8d3;border-radius:9px;background:#fff;font-size:15px}.group{margin:24px 0}.group-title{color:var(--blue);font-size:15px;font-weight:700;padding-bottom:7px;border-bottom:1px solid var(--line)}.item{padding:14px 0;border-bottom:1px solid #ededeb}.meta{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}.selected{font:17px/1.35 Georgia,serif;color:#555;margin:5px 0}.body{font:18px/1.5 Georgia,serif;margin:5px 0}.pill{display:inline-block;padding:3px 8px;background:#f1f1ef;border-radius:12px;font-size:12px}.xref{margin:8px 0;padding:10px 12px;border-left:2px solid #b9cfdf;background:#f7fafc}.xref .fromto{font:16px/1.4 Georgia,serif}.xref .arrow{color:#999;padding:0 5px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px}.delete{color:#a33;background:none;border:0;padding:0;cursor:pointer}.empty{color:var(--muted);font-size:14px;padding:24px 0}.auth{max-width:420px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.auth label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}.row{display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:600}.primary{background:var(--blue);color:#fff}.secondary{background:#f1f1ef}@media(max-width:600px){.wrap{padding:20px 18px 60px}.controls{grid-template-columns:1fr}h1{font-size:30px}.body{font-size:17px}}</style></head><body><header class="top"><a href="companion.html">‹ Companion</a><div class="title">My Study Library</div><div class="spacer"></div><button class="delete" id="signOut" hidden>Sign out</button></header><main class="wrap"><h1>My Study Library</h1><div class="sub">Your synced notes, tags, and scripture connections.</div><section id="authBox" class="auth"><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><div class="row"><button class="btn primary" id="signIn">Sign in</button><button class="btn secondary" id="signUp">Create account</button></div><div class="sub" id="authMsg">Use the same account as Study Companion.</div></section><section id="libraryBox" hidden><div class="signed" id="userEmail"></div><div class="controls"><input id="search" placeholder="Search notes, tags, words, or scripture references…"><select id="typeFilter"><option value="all">All saved study</option><option value="note">Notes</option><option value="tag">Tags</option><option value="link">Scripture connections</option></select></div><div class="stats" id="stats"></div><div id="results"></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://qgkexntrqccusjzxlmyg.supabase.co','sb_publishable_fxGyeKwo2QfovWpKSfMiQw_w5N2yeYF');let user=null,allRows=[],channel=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cu=(ref,text='')=>'companion.html?ref='+encodeURIComponent(ref)+'&text='+encodeURIComponent(text||ref);function body(r){if(r.annotation_type==='note')return esc(r.note_text||'');if(r.annotation_type==='tag')return '<span class="pill">#'+esc(r.tag||'')+'</span>';if(r.annotation_type==='link'){if(r.target_reference)return `<div class="xref"><div class="fromto"><a href="${cu(r.reference,r.selected_text)}">${esc(r.reference)}</a><span class="arrow">↔</span><a href="${cu(r.target_reference,'')}">${esc(r.target_reference)}</a></div>${r.selected_text?`<div class="selected">${esc(r.selected_text)}</div>`:''}</div>`;if(r.target_url)return `<a href="${esc(r.target_url)}" target="_blank">${esc(r.target_url)}</a>`}return ''}function filtered(){const q=search.value.trim().toLowerCase(),t=typeFilter.value;return allRows.filter(r=>(t==='all'||r.annotation_type===t)&&(!q||[r.reference,r.selected_text,r.note_text,r.tag,r.target_reference,r.target_url].some(v=>String(v||'').toLowerCase().includes(q))))}function render(){const rows=filtered();stats.textContent=rows.length+' saved item'+(rows.length===1?'':'s');if(!rows.length){results.innerHTML='<div class="empty">No matching saved study items.</div>';return}const groups=new Map();for(const r of rows){if(!groups.has(r.reference))groups.set(r.reference,[]);groups.get(r.reference).push(r)}results.innerHTML=[...groups].map(([ref,items])=>`<section class="group"><div class="group-title">${esc(ref)}</div>${items.map(r=>`<div class="item"><div class="meta">${r.annotation_type==='link'?'scripture connection':esc(r.annotation_type)}</div>${r.annotation_type!=='link'&&r.selected_text?`<div class="selected">${esc(r.selected_text)}</div>`:''}<div class="body">${body(r)}</div><div class="actions"><a href="${cu(r.reference,r.selected_text)}">Study ${esc(r.reference)}</a>${r.target_reference?`<a href="${cu(r.target_reference,'')}">Study ${esc(r.target_reference)}</a>`:''}<button class="delete" data-del="${r.id}">Delete</button></div></div>`).join('')}</section>`).join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await sb.from('study_annotations').delete().eq('id',b.dataset.del);await load()})}async function load(){if(!user)return;const{data,error}=await sb.from('study_annotations').select('*').neq('annotation_type','highlight').order('updated_at',{ascending:false});if(error){results.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}allRows=data||[];render()}function subscribe(){if(channel)sb.removeChannel(channel);if(user)channel=sb.channel('library-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'study_annotations',filter:'user_id=eq.'+user.id},()=>load()).subscribe()}async function refresh(){const{data:{user:u}}=await sb.auth.getUser();user=u||null;authBox.hidden=!!user;libraryBox.hidden=!user;signOut.hidden=!user;if(user){userEmail.textContent='Signed in as '+(user.email||'');await load();subscribe()}}signIn.onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});authMsg.textContent=error?error.message:'Signed in.';if(!error)refresh()};signUp.onclick=async()=>{const{error}=await sb.auth.signUp({email:email.value.trim(),password:password.value});authMsg.textContent=error?error.message:'Account created.'};signOut.onclick=async()=>{await sb.auth.signOut();refresh()};search.oninput=render;typeFilter.onchange=render;sb.auth.onAuthStateChange(()=>refresh());refresh();</script></body></html>
