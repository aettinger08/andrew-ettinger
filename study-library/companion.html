<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfbfa"><title>Study Companion</title><style>:root{--bg:#fbfbfa;--ink:#252525;--muted:#777;--line:#e7e7e3;--blue:#2f6f9f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:10;background:#fbfbfaf4;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:54px;padding:8px 14px}.back,.copy{border:0;background:none;color:var(--blue);font-size:16px;padding:8px 4px}.copy{margin-left:auto;font-size:14px}.title{margin-left:10px;font-weight:600;font-size:17px}.wrap{max-width:760px;margin:auto;padding:24px 22px 70px}.ref{font-size:15px;color:var(--blue);font-weight:600;margin-bottom:8px}.word{font:36px/1.08 Georgia,"Times New Roman",serif;margin:0 0 16px}.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 16px}.tab{border:1px solid var(--line);background:#fff;color:#444;border-radius:18px;padding:7px 11px;font-size:13px}.tab.active{background:#eaf2f8;border-color:#b9cfdf;color:#245d87;font-weight:600}.panel{border-top:1px solid var(--line);padding-top:20px;min-height:180px}.panel h2{font-size:13px;margin:0 0 12px}.panel h3{font:700 21px/1.25 Georgia,"Times New Roman",serif;margin:18px 0 9px}.panel p,.panel li{font:18px/1.55 Georgia,"Times New Roman",serif;margin:7px 0}.panel a{color:var(--blue);text-decoration:none}.orig{font:34px/1.2 "Times New Roman",serif;margin:5px 0}.langlabel{font-size:12px;letter-spacing:.08em;font-weight:800}.translit{font:17px Georgia,serif}.sourcebox{border-left:2px solid #d7d7d2;padding:2px 0 2px 14px;margin:14px 0}.sourcebox .label{font-size:12px;font-weight:700}.sourcebox .source{font-size:12px;margin-top:7px}.definition{margin:14px 0}.definition .n{font-size:12px;color:var(--muted);font-weight:700}.linkrow,.translation,.langentry{padding:11px 0;border-top:1px solid #eee}.langentry:first-of-type,.translation:first-of-type{border-top:0}.translation .name{font-size:12px;font-weight:800}.translation .text{font:18px/1.55 Georgia,"Times New Roman",serif;margin-top:6px}.status,.empty,.meta{font-size:12px;color:var(--muted)}.research-group h3{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}@media(max-width:600px){.wrap{padding:20px 18px 60px}.word{font-size:34px}.panel p,.panel li,.translation .text{font-size:17px}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tab{width:100%;font-size:12px;padding:9px 8px}.tab:last-child:nth-child(odd){grid-column:1/-1}}</style></head><body><header class="top"><button class="back" id="returnBtn">‹ Gospel Library</button><div class="title">Study Companion</div><button class="copy" id="copyLink">Copy Link</button></header><main class="wrap"><div class="ref" id="referenceText">—</div><h1 class="word" id="selectedText">—</h1><div class="tabs" id="tabs"></div><section class="panel" id="panel"><div class="empty">Loading study sources…</div></section></main><script>
const BASE='https://qgkexntrqccusjzxlmyg.supabase.co/functions/v1/';
const STUDY=BASE+'study-lookup', INDEX=BASE+'source-index-lookup', LANG=BASE+'original-language-lookup', TRANS=BASE+'translation-lookup';
const q=new URLSearchParams(location.search),raw=(q.get('text')||q.get('input')||'').trim(),explicitRef=(q.get('ref')||'').trim();
const BOOKS='Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|1 Samuel|2 Samuel|1 Kings|2 Kings|1 Chronicles|2 Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Song of Solomon|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|1 Corinthians|2 Corinthians|Galatians|Ephesians|Philippians|Colossians|1 Thessalonians|2 Thessalonians|1 Timothy|2 Timothy|Titus|Philemon|Hebrews|James|1 Peter|2 Peter|1 John|2 John|3 John|Jude|Revelation';
const R=new RegExp('\\b('+BOOKS+')\\s+(\\d+):(\\d+)','i');
function parse(input){let s=input.replace(/\u00a0/g,' ').trim(),url='';const ui=s.search(/https?:\/\//i);if(ui>=0){url=s.slice(ui).trim();s=s.slice(0,ui).trim()}let book='',chapter='',verse='',ref=explicitRef,m=(ref||s).match(R);if(m){book=m[1];chapter=m[2];verse=m[3];ref=book+' '+chapter+':'+verse;s=s.replace(m[0],' ').trim()}if(!ref&&url){let u=url.match(/\/scriptures\/(?:ot|nt)\/([^/]+)\/(\d+).*?(?:id=p(\d+)|#p(\d+))/i);if(u){const map={gen:'Genesis',ex:'Exodus',lev:'Leviticus',num:'Numbers',deut:'Deuteronomy',matt:'Matthew',mark:'Mark',luke:'Luke',john:'John'};book=map[u[1].toLowerCase()]||u[1];chapter=u[2];verse=u[3]||u[4]||'';ref=book+' '+chapter+(verse?':'+verse:'')}}if(ref&&s){s=s.replace(new RegExp('^'+book.replace(/ /g,'\\s+')+'\\s+'+chapter+'\\s*[:.]?\\s*'+verse+'\\s*','i'),'').trim();s=s.replace(new RegExp('^'+book.replace(/ /g,'\\s+')+'\\s+'+chapter+verse+'\\s*','i'),'').trim()}return{text:s.replace(/^[-–—:;,.\s]+|[-–—:;,.\s]+$/g,'').replace(/\s+/g,' '),url,ref}}
const st=parse(raw),phrase=st.text.replace(/[“”"']/g,'').trim();referenceText.textContent=st.ref||'Reference not detected';selectedText.textContent=phrase||'No selection';
const labels={footnotes:'Footnotes',language:'Hebrew/Greek',definitions:'Definitions',gtts:'GTTS',bible_dictionary:'Bible Dictionary',topical_guide:'Topical Guide',translations:'Translations',research:'Research'};let categories={};const tabs=document.getElementById('tabs'),panel=document.getElementById('panel');
const a=(label,url)=>url?`<a href="${url}" target="_blank">${label}</a>`:label;function add(id,row){(categories[id]??=[]);const k=row.source_key||row.source_url||JSON.stringify(row.payload||{});if(!categories[id].some(x=>(x.source_key||x.source_url||JSON.stringify(x.payload||{}))===k))categories[id].push(row)}function source(row){return row.source_url?`<div class="source"><a href="${row.source_url}" target="_blank">Source: ${row.source_label||row.title||'Open source'} →</a></div>`:''}
function mergeIndex(entries){for(const e of entries||[]){const c=e.content||{};if(e.source_type==='gtts')add('gtts',{source_key:e.source_key,source_label:'Guide to the Scriptures',source_url:e.source_url,title:e.title,payload:{title:e.title,...c}});else if(e.source_type==='topical_guide')add('topical_guide',{source_key:e.source_key,source_label:'Topical Guide',source_url:e.source_url,payload:{entries:[{label:e.title,url:e.source_url}]}});else if(e.source_type==='bible_dictionary')add('bible_dictionary',{source_key:e.source_key,source_label:'Bible Dictionary',source_url:e.source_url,payload:{entries:[{label:e.title,url:e.source_url}],...c}});else if(e.source_type==='research')add('research',{source_key:e.source_key,source_label:e.title,source_url:e.source_url,payload:c})}}
function stems(s){const w=s.toLowerCase().replace(/[^a-z0-9]/g,'');const x=new Set([w]);if(w.endsWith('ed')){x.add(w.slice(0,-1));x.add(w.slice(0,-2))}if(w.endsWith('ing')){x.add(w.slice(0,-3));x.add(w.slice(0,-3)+'e')}if(w.endsWith('es'))x.add(w.slice(0,-2));if(w.endsWith('s'))x.add(w.slice(0,-1));return [...x]}
function exactWords(s){return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(Boolean)}
function clientScore(m){const kv=new Set(exactWords(m.kjv_definition)),sd=new Set(exactWords(m.strongs_definition));let score=0;for(const v of stems(phrase)){if(kv.has(v))score+=10;if(sd.has(v))score+=4}if(/^N-|^V-|^A-|^ADV|^PREP|^CONJ|^T-/.test(m.morph||''))score+=0;return score}
function mergeLanguage(j){let rows=(j?.verse_words||j?.matches||[]).map(x=>({...x,_score:clientScore(x)}));const best=Math.max(0,...rows.map(x=>x._score));if(best>0)rows=rows.filter(x=>x._score===best);else rows=j?.matches||[];const seen=new Set();rows=rows.filter(x=>{const k=x.strong+'|'+x.surface;if(seen.has(k))return false;seen.add(k);return true}).slice(0,4);if(rows.length)add('language',{source_key:'auto-language:'+st.ref+':'+phrase,source_label:'Open Strong’s / original-language corpus',payload:{matches:rows}})}
function render(id){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.id===id));if(id==='translations'){renderTranslations();return}const rows=categories[id]||[];let html='<h2>'+labels[id]+'</h2>';for(const row of rows){const p=row.payload||{};if(id==='footnotes'){html+=`<p>${p.text||''}</p>`;(p.citations||[]).forEach(c=>html+=`<div class="sourcebox"><div class="label">${c.label}</div><p>${c.text||''}</p><div class="source">${a('Open '+c.label+' source →',c.url)}</div></div>`)}else if(id==='language'){for(const m of p.matches||[]){html+=`<div class="langentry"><div class="langlabel"><strong>${m.language||''}</strong></div><div class="orig">${m.surface||''}</div><div class="translit"><strong>${m.transliteration||''}</strong>${m.strong?' · '+m.strong:''}</div>${m.pronunciation?`<p><strong>Pronunciation:</strong> ${m.pronunciation}</p>`:''}${m.morph?`<p><strong>Morphology:</strong> ${m.morph}</p>`:''}${m.derivation?`<h3>Derivation</h3><p>${m.derivation}</p>`:''}${m.strongs_definition?`<h3>Strong’s Definition</h3><p>${m.strongs_definition}</p>`:''}${m.kjv_definition?`<h3>KJV Renderings</h3><p>${m.kjv_definition}</p>`:''}<div class="source"><a href="https://www.blueletterbible.org/lexicon/${(m.strong||'').toLowerCase()}/kjv/wlc/0-1/" target="_blank">Open ${m.strong} source →</a></div></div>`}}else if(id==='definitions'){if(p.webster1828)html+='<h3>Webster 1828</h3>'+p.webster1828.map((x,i)=>`<div class="definition"><div class="n">${i+1}</div><p>${x}</p></div>`).join('');if(p.summary)html+=`<p>${p.summary}</p>`;html+=source(row)}else if(id==='gtts'){html+=`<h3>${p.title||row.title||'Guide to the Scriptures'}</h3>`;if(p.see?.length)html+=`<p><em>See also</em> ${p.see.map(x=>a(x.label,x.url)).join('; ')}</p>`;if(p.intro)html+=`<p>${p.intro}</p>`;if(p.items?.length)html+=`<ul>${p.items.map(x=>`<li>${x.text} ${a(x.ref,x.url)}.</li>`).join('')}</ul>`;html+=source(row)}else if(id==='topical_guide'||id==='bible_dictionary'){for(const x of p.entries||[])html+=`<div class="linkrow">${a(x.label,x.url)}</div>`;html+=source(row)}else if(id==='research'){if(p.lds?.length)html+=`<div class="research-group"><h3>LDS Sources</h3>${p.lds.map(x=>`<div class="linkrow">${a(x.label,x.url)}</div>`).join('')}</div>`;if(p.other?.length)html+=`<div class="research-group"><h3>Other Sources</h3>${p.other.map(x=>`<div class="linkrow">${a(x.label,x.url)}</div>`).join('')}</div>`}}panel.innerHTML=html||'<div class="empty">No correlated content found.</div>'}
async function renderTranslations(){panel.innerHTML='<h2>Translations</h2><div class="empty">Loading translations…</div>';try{const j=await (await fetch(TRANS+'?ref='+encodeURIComponent(st.ref))).json();panel.innerHTML='<h2>Translations</h2>'+j.translations.map(t=>`<div class="translation"><div class="name">${t.id}</div>${t.text?`<div class="text">${t.text}</div>`:`<div class="status">${({authorization_required:'Authorized source still required',permission_required:'Permission/source still required',credentials_required:'API credential not connected'})[t.status]||t.status}</div>`}</div>`).join('')}catch{panel.innerHTML='<h2>Translations</h2><div class="empty">Translation service could not be reached.</div>'}}
function buildTabs(){tabs.innerHTML='';const order=['footnotes','language','definitions','gtts','bible_dictionary','topical_guide','translations','research'],ids=order.filter(id=>id==='translations'||categories[id]?.length);ids.forEach((id,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.dataset.id=id;b.textContent=labels[id];b.onclick=()=>render(id);tabs.appendChild(b)});if(ids.length)render(ids[0])}
async function load(){if(!st.ref||!phrase){panel.innerHTML='<div class="empty">Reference or selected word could not be detected.</div>';return}try{const urls=[STUDY+'?ref='+encodeURIComponent(st.ref)+'&phrase='+encodeURIComponent(phrase),INDEX+'?ref='+encodeURIComponent(st.ref)+'&phrase='+encodeURIComponent(phrase),LANG+'?ref='+encodeURIComponent(st.ref)+'&phrase='+encodeURIComponent(phrase)];const [s,i,l]=await Promise.all(urls.map(u=>fetch(u).then(r=>r.json()).catch(()=>({}))));categories=s.categories||{};mergeIndex(i.entries||[]);mergeLanguage(l);buildTabs()}catch{categories={};buildTabs()}}
copyLink.onclick=async()=>{await navigator.clipboard.writeText(location.href);copyLink.textContent='Copied'};returnBtn.onclick=()=>st.url?location.href=st.url:history.back();load();
</script></body></html>
