textarea id="noteText" placeholder="Add your thoughts…"></textarea></div></div><div id="highlightFields" hidden><div class="field"><label>Highlight color</label><select id="highlightColor"><option value="yellow">Yellow</option><option value="blue">Blue</option><option value="green">Green</option><option value="pink">Pink</option></select></div></div><div id="tagFields" hidden><div class="field"><label>Tag</label><input id="tagText" placeholder="creation, covenant, temple…"></div></div><div id="linkFields" hidden><div class="field"><label>Target reference</label><input id="targetRef" placeholder="Abraham 4:1"></div><div class="field"><label>Or URL</label><input id="targetUrl" placeholder="https://…"></div></div><button class="btn primary" id="saveAnnotation">Save</button><h3 style="margin-top:24px">Saved here</h3><div id="annotations"></div></div></div></aside><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const SBURL='https://qgkexntrqccusjzxlmyg.supabase.co',SBKEY='sb_publishable_fxGyeKwo2QfovWpKSfMiQw_w5N2yeYF',sb=createClient(SBURL,SBKEY);const BASE=SBURL+'/functions/v1/';const EP={study:BASE+'study-lookup',lang:BASE+'original-language-lookup',foot:BASE+'lds-footnote-lookup',help:BASE+'lds-study-help-lookup',defs:BASE+'definition-lookup',trans:BASE+'translation-lookup'};const params=new URLSearchParams(location.search),raw=(params.get('text')||params.get('input')||'').trim(),explicitRef=(params.get('ref')||'').trim();const BOOKS='Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|1 Samuel|2 Samuel|1 Kings|2 Kings|1 Chronicles|2 Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Song of Solomon|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|1 Corinthians|2 Corinthians|Galatians|Ephesians|Philippians|Colossians|1 Thessalonians|2 Thessalonians|1 Timothy|2 Timothy|Titus|Philemon|Hebrews|James|1 Peter|2 Peter|1 John|2 John|3 John|Jude|Revelation',REF_RE=new RegExp('\\b('+BOOKS+')\\s+(\\d+):(\\d+)','i');function parseShare(input){let s=input.replace(/\u00a0/g,' ').trim(),url='';const ui=s.search(/https?:\/\//i);if(ui>=0){url=s.slice(ui).trim();s=s.slice(0,ui).trim()}let book='',chapter='',verse='',ref=explicitRef;const m=(ref||s).match(REF_RE);if(m){book=m[1];chapter=m[2];verse=m[3];ref=`${book} ${chapter}:${verse}`;s=s.replace(m[0],' ').trim()}if(!ref&&url){const u=url.match(/\/scriptures\/(?:ot|nt)\/([^/]+)\/(\d+).*?(?:id=p(\d+)|#p(\d+))/i);if(u){const map={gen:'Genesis',ex:'Exodus',lev:'Leviticus',num:'Numbers',deut:'Deuteronomy',josh:'Joshua',judg:'Judges',ps:'Psalms',prov:'Proverbs',isa:'Isaiah',jer:'Jeremiah',matt:'Matthew',mark:'Mark',luke:'Luke',john:'John',acts:'Acts',rom:'Romans'};book=map[u[1].toLowerCase()]||u[1];chapter=u[2];verse=u[3]||u[4]||'';ref=`${book} ${chapter}${verse?':'+verse:''}`}}if(ref&&s&&book)s=s.replace(new RegExp('^'+book.replace(/ /g,'\\s+')+'\\s+'+chapter+'\\s*[:.]?\\s*'+verse+'\\s*','i'),'').trim();return{text:s.replace(/^[-–—:;,.\s]+|[-–—:;,.\s]+$/g,'').replace(/\s+/g,' '),url,ref}}const st=parseShare(raw),phrase=st.text.replace(/[“”"']/g,'').trim();referenceText.textContent=st.ref||'Reference not detected';selectedText.textContent=phrase||'No selection';const labels={footnotes:'Footnotes',language:'Hebrew/Greek',definitions:'Definitions',gtts:'GTTS',bible_dictionary:'Bible Dictionary',topical_guide:'Topical Guide',translations:'Translations',research:'Research'};let categories={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),link=(label,url)=>url?`<a href="${esc(url)}" target="_blank">${esc(label)}</a>`:esc(label);function add(id,row){categories[id]??=[];const k=row.source_key||row.source_url||JSON.stringify(row.payload||{});if(!categories[id].some(x=>(x.source_key||x.source_url||JSON.stringify(x.payload||{}))===k))categories[id].push(row)}function mergeFootnotes(j){for(const f of j?.footnotes||[])add('footnotes',{source_key:'lds:'+st.ref+':'+f.marker,source_url:f.source_url,payload:f})}function stemSet(s){const w=s.toLowerCase().replace(/[^a-z0-9]/g,''),x=new Set([w]);if(w.endsWith('ed')){x.add(w.slice(0,-1));x.add(w.slice(0,-2))}if(w.endsWith('ing')){x.add(w.slice(0,-3));x.add(w.slice(0,-3)+'e')}if(w.endsWith('es'))x.add(w.slice(0,-2));if(w.endsWith('s'))x.add(w.slice(0,-1));return [...x]}function wordSet(s){return new Set((s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(Boolean))}function languageScore(m){const kd=wordSet(m.kjv_definition),sd=wordSet(m.strongs_definition);let n=0;for(const v of stemSet(phrase)){if(kd.has(v))n+=10;if(sd.has(v))n+=4}return n}function mergeLanguage(j){let rows=(j?.verse_words||j?.matches||[]).map(x=>({...x,_score:languageScore(x)}));const best=Math.max(0,...rows.map(x=>x._score));rows=best>0?rows.filter(x=>x._score===best):(j?.matches||[]);const seen=new Set();rows=rows.filter(x=>{const k=x.strong+'|'+x.surface;if(seen.has(k))return false;seen.add(k);return true}).slice(0,4);if(rows.length)add('language',{source_key:'language:'+st.ref+':'+phrase,payload:{matches:rows}})}function mergeStudy(j){for(const [id,rows] of Object.entries(j?.categories||{}))if(id==='research')for(const row of rows)add(id,row)}function mergeHelp(j){for(const e of j?.entries||[])if(e.content_html)add(e.source_type,{source_key:'live-help:'+e.source_url,source_url:e.source_url,title:e.title,payload:{content_html:e.content_html}})}function mergeDefinitions(j){for(const e of j?.entries||[])add('definitions',{source_key:'webster:'+e.lemma,source_url:e.source_url,payload:e})}function renderFootnotes(rows){let h='<h2>Footnotes</h2>';for(const r of rows){const p=r.payload||{};h+=`<p>${esc(p.text||'')}</p>`;for(const e of p.expansions||[])h+=`<div class="sourcebox"><div class="label">${esc(e.label)}</div><p>${esc(e.text)}</p><div class="source">${link('Open '+e.label+' source →',e.url)}</div></div>`;if(p.links?.length)h+=`<div class="sourcebox"><div class="label">Related links</div>${p.links.map(x=>`<div class="linkrow">${link(x.label,x.url)}</div>`).join('')}</div>`}return h}function renderLanguage(rows){let h='<h2>Hebrew/Greek</h2>';for(const r of rows)for(const m of r.payload?.matches||[]){const blb=`https://www.blueletterbible.org/lexicon/${(m.strong||'').toLowerCase()}/kjv/${String(m.strong||'').startsWith('H')?'wlc':'tr'}/0-1/`;h+=`<div class="langentry"><div class="langlabel"><strong>${esc(m.language||'')}</strong></div><div class="orig">${esc(m.surface||'')}</div><div class="translit"><strong>${esc(m.transliteration||'')}</strong>${m.strong?' · '+esc(m.strong):''}</div>${m.pronunciation?`<p><strong>Pronunciation:</strong> ${esc(m.pronunciation)}</p>`:''}${m.morph?`<p><strong>Morphology:</strong> ${esc(m.morph)}</p>`:''}${m.derivation?`<h3>Derivation</h3><p>${esc(m.derivation)}</p>`:''}${m.strongs_definition?`<h3>Strong’s Definition</h3><p>${esc(m.strongs_definition)}</p>`:''}${m.kjv_definition?`<h3>KJV Renderings</h3><p>${esc(m.kjv_definition)}</p>`:''}<div class="help-source"><a href="${blb}" target="_blank">Open ${esc(m.strong)} source →</a></div></div>`}return h}function renderHelp(id,rows){let h='<h2>'+labels[id]+'</h2>';for(const r of rows)h+=`<div class="helpentry">${r.payload?.content_html||''}<div class="help-source">${link('Official Church source →',r.source_url)}</div></div>`;return h}function renderDefinitions(rows){let h='<h2>Definitions</h2>';for(const r of rows){const p=r.payload||{};h+=`<div class="helpentry"><h3>${esc(p.headword||'Webster 1828')}</h3>${(p.definitions||[]).map((d,i)=>`<div class="sourcebox"><div class="label">${i+1}</div><p>${esc(d)}</p></div>`).join('')}<div class="help-source">${link("Webster's Dictionary 1828 source →",r.source_url)}</div></div>`}return h}function renderGeneric(id,rows){let h='<h2>'+labels[id]+'</h2>';for(const r of rows){const p=r.payload||{};if(id==='research'){if(p.lds?.length)h+=`<h3>LDS Sources</h3>`+p.lds.map(x=>`<div class="linkrow">${link(x.label,x.url)}${x.excerpt?.[1]?`<div class="meta">${esc(x.excerpt[1].slice(0,240))}…</div>`:''}</div>`).join('');if(p.other?.length)h+=`<h3>Other Sources</h3>`+p.other.map(x=>`<div class="linkrow">${link(x.label,x.url)}</div>`).join('')}}return h}function render(id){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.id===id));if(id==='translations')return renderTranslations();const rows=categories[id]||[];panel.innerHTML=id==='footnotes'?renderFootnotes(rows):id==='language'?renderLanguage(rows):id==='definitions'?renderDefinitions(rows):['gtts','bible_dictionary','topical_guide'].includes(id)?renderHelp(id,rows):renderGeneric(id,rows)}async function renderTranslations(){panel.innerHTML='<h2>Translations</h2><div class="loading">Loading translations…</div>';try{const j=await fetch(EP.trans+'?ref='+encodeURIComponent(st.ref)).then(r=>r.json());panel.innerHTML='<h2>Translations</h2>'+j.translations.map(t=>`<div class="translation"><div class="name">${esc(t.id)}</div>${t.text?`<div class="text">${esc(t.text)}</div>`:`<div class="status">${esc(t.status)}</div>`}</div>`).join('')}catch{panel.innerHTML='<h2>Translations</h2><div class="empty">Translation service could not be reached.</div>'}}function buildTabs(){tabs.innerHTML='';const order=['footnotes','language','definitions','gtts','bible_dictionary','topical_guide','translations','research'],ids=order.filter(id=>id==='translations'||categories[id]?.length);ids.forEach((id,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.dataset.id=id;b.textContent=labels[id];b.onclick=()=>render(id);tabs.appendChild(b)});if(ids.length)render(ids[0])}async function load(){if(!st.ref||!phrase){panel.innerHTML='<div class="empty">Reference or selected word could not be detected.</div>';return}const qs='?ref='+encodeURIComponent(st.ref)+'&phrase='+encodeURIComponent(phrase),hp='?phrase='+encodeURIComp
