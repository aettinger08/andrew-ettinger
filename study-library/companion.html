<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfbfa">
<title>Study Companion</title>
<style>
:root{--bg:#fbfbfa;--ink:#252525;--muted:#777;--line:#e7e7e3;--blue:#2f6f9f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:10;background:#fbfbfaf4;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:54px;padding:8px 14px}.back,.copy{border:0;background:none;color:var(--blue);font-size:16px;padding:8px 4px}.copy{margin-left:auto;font-size:14px}.title{margin-left:10px;font-weight:600;font-size:17px}.wrap{max-width:760px;margin:auto;padding:24px 22px 70px}.ref{font-size:15px;color:var(--blue);font-weight:600;margin-bottom:8px}.word{font:36px/1.08 Georgia,"Times New Roman",serif;margin:0 0 16px}.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 16px}.tab{border:1px solid var(--line);background:#fff;color:#444;border-radius:18px;padding:7px 11px;font-size:13px}.tab.active{background:#eaf2f8;border-color:#b9cfdf;color:#245d87;font-weight:600}.panel{border-top:1px solid var(--line);padding-top:20px;min-height:180px}.panel h2{font-size:13px;margin:0 0 12px}.panel h3{font:700 21px/1.25 Georgia,"Times New Roman",serif;margin:18px 0 9px}.panel p,.panel li{font:18px/1.55 Georgia,"Times New Roman",serif;margin:7px 0}.panel a{color:var(--blue);text-decoration:none}.orig{font:34px/1.2 "Times New Roman",serif;margin:5px 0}.langlabel{font-size:12px;letter-spacing:.08em;font-weight:800}.translit{font:17px Georgia,serif}.sourcebox{border-left:2px solid #d7d7d2;padding:2px 0 2px 14px;margin:14px 0}.sourcebox .label{font-size:12px;font-weight:700}.sourcebox .source{font-size:12px;margin-top:7px}.linkrow,.translation,.langentry{padding:11px 0;border-top:1px solid #eee}.translation .name{font-size:12px;font-weight:800}.translation .text{font:18px/1.55 Georgia,"Times New Roman",serif;margin-top:6px}.status,.empty,.meta{font-size:12px;color:var(--muted)}.research-group h3{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@media(max-width:600px){.wrap{padding:20px 18px 60px}.word{font-size:34px}.panel p,.panel li,.translation .text{font-size:17px}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tab{width:100%;font-size:12px;padding:9px 8px}.tab:last-child:nth-child(odd){grid-column:1/-1}}
</style>
</head>
<body>
<header class="top"><button class="back" id="returnBtn">‹ Gospel Library</button><div class="title">Study Companion</div><button class="copy" id="copyLink">Copy Link</button></header>
<main class="wrap"><div class="ref" id="referenceText">—</div><h1 class="word" id="selectedText">—</h1><div class="tabs" id="tabs"></div><section class="panel" id="panel"><div class="empty">Loading study sources…</div></section></main>
<script>
const BASE='https://qgkexntrqccusjzxlmyg.supabase.co/functions/v1/';
const EP={study:BASE+'study-lookup',index:BASE+'source-index-lookup',lang:BASE+'original-language-lookup',foot:BASE+'lds-footnote-lookup',trans:BASE+'translation-lookup'};
const params=new URLSearchParams(location.search),raw=(params.get('text')||params.get('input')||'').trim(),explicitRef=(params.get('ref')||'').trim();
const BOOKS='Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|1 Samuel|2 Samuel|1 Kings|2 Kings|1 Chronicles|2 Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Song of Solomon|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|1 Corinthians|2 Corinthians|Galatians|Ephesians|Philippians|Colossians|1 Thessalonians|2 Thessalonians|1 Timothy|2 Timothy|Titus|Philemon|Hebrews|James|1 Peter|2 Peter|1 John|2 John|3 John|Jude|Revelation';
const REF_RE=new RegExp('\\b('+BOOKS+')\\s+(\\d+):(\\d+)','i');
function parseShare(input){let s=input.replace(/\u00a0/g,' ').trim(),url='';const ui=s.search(/https?:\/\//i);if(ui>=0){url=s.slice(ui).trim();s=s.slice(0,ui).trim()}let book='',chapter='',verse='',ref=explicitRef;const m=(ref||s).match(REF_RE);if(m){book=m[1];chapter=m[2];verse=m[3];ref=`${book} ${chapter}:${verse}`;s=s.replace(m[0],' ').trim()}if(!ref&&url){const u=url.match(/\/scriptures\/(?:ot|nt)\/([^/]+)\/(\d+).*?(?:id=p(\d+)|#p(\d+))/i);if(u){const map={gen:'Genesis',ex:'Exodus',lev:'Leviticus',num:'Numbers',deut:'Deuteronomy',matt:'Matthew',mark:'Mark',luke:'Luke',john:'John'};book=map[u[1].toLowerCase()]||u[1];chapter=u[2];verse=u[3]||u[4]||'';ref=`${book} ${chapter}${verse?':'+verse:''}`}}if(ref&&s&&book){s=s.replace(new RegExp('^'+book.replace(/ /g,'\\s+')+'\\s+'+chapter+'\\s*[:.]?\\s*'+verse+'\\s*','i'),'').trim();s=s.replace(new RegExp('^'+book.replace(/ /g,'\\s+')+'\\s+'+chapter+verse+'\\s*','i'),'').trim()}return{text:s.replace(/^[-–—:;,.\s]+|[-–—:;,.\s]+$/g,'').replace(/\s+/g,' '),url,ref}}
const st=parseShare(raw),phrase=st.text.replace(/[“”"']/g,'').trim();
referenceText.textContent=st.ref||'Reference not detected';selectedText.textContent=phrase||'No selection';
const labels={footnotes:'Footnotes',language:'Hebrew/Greek',definitions:'Definitions',gtts:'GTTS',bible_dictionary:'Bible Dictionary',topical_guide:'Topical Guide',translations:'Translations',research:'Research'};
let categories={};const tabs=document.getElementById('tabs'),panel=document.getElementById('panel');
const link=(label,url)=>url?`<a href="${url}" target="_blank">${label}</a>`:label;
function add(id,row){categories[id]??=[];const k=row.source_key||row.source_url||JSON.stringify(row.payload||{});if(!categories[id].some(x=>(x.source_key||x.source_url||JSON.stringify(x.payload||{}))===k))categories[id].push(row)}
function mergeIndex(entries){for(const e of entries||[]){const c=e.content||{};if(e.source_type==='gtts')add('gtts',{source_key:e.source_key,source_url:e.source_url,title:e.title,payload:{title:e.title,...c}});else if(e.source_type==='topical_guide')add('topical_guide',{source_key:e.source_key,source_url:e.source_url,payload:{entries:[{label:e.title,url:e.source_url}]}});else if(e.source_type==='bible_dictionary')add('bible_dictionary',{source_key:e.source_key,source_url:e.source_url,payload:{entries:[{label:e.title,url:e.source_url}],...c}});else if(e.source_type==='research')add('research',{source_key:e.source_key,source_url:e.source_url,payload:c})}}
function mergeFootnotes(j){for(const f of j?.footnotes||[])add('footnotes',{source_key:'lds:'+st.ref+':'+f.marker,source_url:f.source_url,payload:f})}
function stemSet(s){const w=s.toLowerCase().replace(/[^a-z0-9]/g,'');const x=new Set([w]);if(w.endsWith('ed')){x.add(w.slice(0,-1));x.add(w.slice(0,-2))}if(w.endsWith('ing')){x.add(w.slice(0,-3));x.add(w.slice(0,-3)+'e')}if(w.endsWith('es'))x.add(w.slice(0,-2));if(w.endsWith('s'))x.add(w.slice(0,-1));return [...x]}
function words(s){return new Set((s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(Boolean))}
function languageScore(m){const kd=words(m.kjv_definition),sd=words(m.strongs_definition);let n=0;for(const v of stemSet(phrase)){if(kd.has(v))n+=10;if(sd.has(v))n+=4}return n}
function mergeLanguage(j){let rows=(j?.verse_words||j?.matches||[]).map(x=>({...x,_score:languageScore(x)}));const best=Math.max(0,...rows.map(x=>x._score));rows=best>0?rows.filter(x=>x._score===best):(j?.matches||[]);const seen=new Set();rows=rows.filter(x=>{const k=x.strong+'|'+x.surface;if(seen.has(k))return false;seen.add(k);return true}).slice(0,4);if(rows.length)add('language',{source_key:'language:'+st.ref+':'+phrase,payload:{matches:rows}})}
function renderFootnotes(rows){let html='<h2>Footnotes</h2>';for(const row of rows){const p=row.payload||{};html+=`<p>${p.text||''}</p>`;for(const e of p.expansions||[])html+=`<div class="sourcebox"><div class="label">${e.label}</div><p>${e.text}</p><div class="source">${link('Open '+e.label+' source →',e.url)}</div></div>`;if(p.links?.length)html+=`<div class="sourcebox"><div class="label">Related links</div>${p.links.map(x=>`<div class="linkrow">${link(x.label,x.url)}</div>`).join('')}<div class="source">${link('Official footnote source →',row.source_url)}</div></div>`}return html}
function renderLanguage(rows){let html='<h2>Hebrew/Greek</h2>';for(const row of rows)for(const m of row.payload?.matches||[]){html+=`<div class="langentry"><div class="langlabel"><strong>${m.language||''}</strong></div><div class="orig">${m.surface||''}</div><div class="translit"><strong>${m.transliteration||''}</strong>${m.strong?' · '+m.strong:''}</div>${m.pronunciation?`<p><strong>Pronunciation:</strong> ${m.pronunciation}</p>`:''}${m.morph?`<p><strong>Morphology:</strong> ${m.morph}</p>`:''}${m.derivation?`<h3>Derivation</h3><p>${m.derivation}</p>`:''}${m.strongs_definition?`<h3>Strong’s Definition</h3><p>${m.strongs_definition}</p>`:''}${m.kjv_definition?`<h3>KJV Renderings</h3><p>${m.kjv_definition}</p>`:''}<div class="source"><a href="https://www.blueletterbible.org/lexicon/${(m.strong||'').toLowerCase()}/kjv/wlc/0-1/" target="_blank">Open ${m.strong} source →</a></div></div>`}return html}
function renderGeneric(id,rows){let html='<h2>'+labels[id]+'</h2>';for(const row of rows){const p=row.payload||{};if(id==='definitions'){if(p.webster1828)html+='<h3>Webster 1828</h3>'+p.webster1828.map((x,i)=>`<div class="sourcebox"><div class="label">${i+1}</div><p>${x}</p></div>`).join('');if(p.summary)html+=`<p>${p.summary}</p>`}else if(id==='gtts'){html+=`<h3>${p.title||row.title||'Guide to the Scriptures'}</h3>`;if(p.see?.length)html+=`<p><em>See also</em> ${p.see.map(x=>link(x.label,x.url)).join('; ')}</p>`;if(p.intro)html+=`<p>${p.intro}</p>`;if(p.items?.length)html+=`<ul>${p.items.map(x=>`<li>${x.text} ${link(x.ref,x.url)}.</li>`).join('')}</ul>`}else if(id==='topical_guide'||id==='bible_dictionary'){for(const x of p.entries||[])html+=`<div class="linkrow">${link(x.label,x.url)}</div>`}else if(id==='research'){if(p.lds?.length)html+=`<div class="research-group"><h3>LDS Sources</h3>${p.lds.map(x=>`<div class="linkrow">${link(x.label,x.url)}</div>`).join('')}</div>`;if(p.other?.length)html+=`<div class="research-group"><h3>Other Sources</h3>${p.other.map(x=>`<div class="linkrow">${link(x.label,x.url)}</div>`).join('')}</div>`}if(row.source_url)html+=`<div class="sourcebox"><div class="source">${link('Open source →',row.source_url)}</div></div>`}return html}
function render(id){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.id===id));if(id==='translations'){renderTranslations();return}const rows=categories[id]||[];panel.innerHTML=id==='footnotes'?renderFootnotes(rows):id==='language'?renderLanguage(rows):renderGeneric(id,rows)}
async function renderTranslations(){panel.innerHTML='<h2>Translations</h2><div class="empty">Loading translations…</div>';try{const j=await fetch(EP.trans+'?ref='+encodeURIComponent(st.ref)).then(r=>r.json());panel.innerHTML='<h2>Translations</h2>'+j.translations.map(t=>`<div class="translation"><div class="name">${t.id}</div>${t.text?`<div class="text">${t.text}</div>`:`<div class="status">${({authorization_required:'Authorized source still required',permission_required:'Permission/source still required',credentials_required:'API credential not connected'})[t.status]||t.status}</div>`}</div>`).join('')}catch{panel.innerHTML='<h2>Translations</h2><div class="empty">Translation service could not be reached.</div>'}}
function buildTabs(){tabs.innerHTML='';const order=['footnotes','language','definitions','gtts','bible_dictionary','topical_guide','translations','research'];const ids=order.filter(id=>id==='translations'||categories[id]?.length);ids.forEach((id,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.dataset.id=id;b.textContent=labels[id];b.onclick=()=>render(id);tabs.appendChild(b)});if(ids.length)render(ids[0]);else panel.innerHTML='<div class="empty">No correlated study sources found.</div>'}
async function load(){if(!st.ref||!phrase){panel.innerHTML='<div class="empty">Reference or selected word could not be detected.</div>';return}const qs='?ref='+encodeURIComponent(st.ref)+'&phrase='+encodeURIComponent(phrase);const reqs=[fetch(EP.study+qs).then(r=>r.json()).catch(()=>({})),fetch(EP.index+qs).then(r=>r.json()).catch(()=>({})),fetch(EP.lang+qs).then(r=>r.json()).catch(()=>({})),fetch(EP.foot+qs).then(r=>r.json()).catch(()=>({}))];const [study,index,lang,foot]=await Promise.all(reqs);categories=study.categories||{};delete categories.footnotes;delete categories.language;mergeIndex(index.entries||[]);mergeLanguage(lang);mergeFootnotes(foot);buildTabs()}
copyLink.onclick=async()=>{await navigator.clipboard.writeText(location.href);copyLink.textContent='Copied'};returnBtn.onclick=()=>st.url?location.href=st.url:history.back();load();
</script>
</body>
</html>
