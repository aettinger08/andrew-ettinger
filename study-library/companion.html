<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfbfa"><title>Study Companion</title><style>:root{--bg:#fbfbfa;--ink:#252525;--muted:#777;--line:#e7e7e3;--blue:#2f6f9f;--soft:#f3f4f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:10;background:#fbfbfaf4;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:54px;padding:8px 14px}.back,.copy{border:0;background:none;color:var(--blue);font-size:16px;padding:8px 4px;cursor:pointer}.copy{margin-left:auto;font-size:14px}.title{margin-left:10px;font-weight:600;font-size:17px}.wrap{max-width:760px;margin:auto;padding:24px 22px 70px}.ref{font-size:15px;color:var(--blue);font-weight:600;margin-bottom:8px}.word{font:36px/1.08 Georgia,"Times New Roman",serif;margin:0 0 16px}.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 16px;margin-bottom:4px}.tab{border:1px solid var(--line);background:#fff;color:#444;border-radius:18px;padding:7px 11px;font-size:13px;cursor:pointer}.tab.active{background:#eaf2f8;border-color:#b9cfdf;color:#245d87;font-weight:600}.panel{border-top:1px solid var(--line);padding-top:20px;min-height:180px}.panel h2{font-size:13px;margin:0 0 12px}.panel p,.panel li{font:18px/1.55 Georgia,"Times New Roman",serif;margin:7px 0}.panel a{color:var(--blue);text-decoration:none}.panel a:hover{text-decoration:underline}.hebrew{font:34px/1.2 "Times New Roman",serif;direction:rtl;text-align:left;margin:5px 0}.translit{font:17px Georgia,serif}.linkrow{padding:10px 0;border-top:1px solid #eeeeeb}.linkrow:first-child{border-top:0}.meta{font-size:12px;color:var(--muted);margin-left:6px}.empty{font-size:14px;color:var(--muted)}.research-group h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px}@media(max-width:600px){.wrap{padding:20px 18px 60px}.word{font-size:34px}.panel p,.panel li{font-size:17px}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tab{width:100%;font-size:12px;padding:9px 8px;text-align:center}.tab:last-child:nth-child(odd){grid-column:1/-1}}</style></head><body><header class="top"><button class="back" id="returnBtn">‹ Gospel Library</button><div class="title">Study Companion</div><button class="copy" id="copyLink">Copy Link</button></header><main class="wrap"><div class="ref" id="referenceText">—</div><h1 class="word" id="selectedText">—</h1><div class="tabs" id="tabs"></div><section class="panel" id="panel"><div class="empty">Choose a study source above.</div></section></main><script>const q=new URLSearchParams(location.search);const raw=(q.get('text')||q.get('input')||'').trim();const explicitRef=(q.get('ref')||'').trim();const BOOKS='Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|1 Samuel|2 Samuel|1 Kings|2 Kings|1 Chronicles|2 Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|1 Corinthians|2 Corinthians|Galatians|Ephesians|Philippians|Colossians|1 Thessalonians|2 Thessalonians|1 Timothy|2 Timothy|Titus|Philemon|Hebrews|James|1 Peter|2 Peter|1 John|2 John|3 John|Jude|Revelation';const R=new RegExp('\\b('+BOOKS+')\\s+(\\d+):(\\d+)','i');function parse(input){let s=input.replace(/\u00a0/g,' ').trim(),url='';const ui=s.search(/https?:\/\//i);if(ui>=0){url=s.slice(ui).trim();s=s.slice(0,ui).trim()}let book='',chapter='',verse='',ref=explicitRef;let m=(ref||s).match(R);if(m){book=m[1];chapter=m[2];verse=m[3];ref=book+' '+chapter+':'+verse;s=s.replace(m[0],' ').trim()}if(!ref&&url){let u=url.match(/\/scriptures\/(?:ot|nt)\/([^/]+)\/(\d+).*?(?:id=p(\d+)|#p(\d+))/i);if(u){const map={gen:'Genesis',ex:'Exodus',lev:'Leviticus',num:'Numbers',deut:'Deuteronomy',matt:'Matthew',mark:'Mark',luke:'Luke',john:'John'};book=map[u[1].toLowerCase()]||u[1];chapter=u[2];verse=u[3]||u[4]||'';ref=book+' '+chapter+(verse?':'+verse:'')}}if(ref&&s){s=s.replace(new RegExp('^'+book.replace(/ /g,'\\s+')+'\\s+'+chapter+'\\s*[:.]?\\s*'+verse+'\\s*','i'),'').trim();s=s.replace(new RegExp('^'+book.replace(/ /g,'\\s+')+'\\s+'+chapter+verse+'\\s*','i'),'').trim()}s=s.replace(/^[-–—:;,.\s]+|[-–—:;,.\s]+$/g,'').replace(/\s+/g,' ');return{text:s,url,ref}}const st=parse(raw);const phrase=st.text.replace(/[“”"']/g,'').trim();referenceText.textContent=st.ref||'Reference not detected';selectedText.textContent=phrase||'No selection';const key=st.ref+'|'+phrase.toLowerCase();const data={'Genesis 1:1|created':{footnotes:`HEB shaped, fashioned, created; always divine activity; see <a href="https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?id=p1#p1" target="_blank">Abraham 4:1</a>, organized, formed. <a href="https://www.churchofjesuschrist.org/study/scriptures/tg/creation?lang=eng" target="_blank">TG Creation</a>; <a href="https://www.churchofjesuschrist.org/study/scriptures/tg/god-creator?lang=eng" target="_blank">TG God, Creator</a>.`,language:{he:'בָּרָא',tr:'bārāʾ',strong:'H1254',meaning:'create, shape, form'},definitions:[['Webster 1828 — create','https://webstersdictionary1828.com/Dictionary/create'],['Oxford English Dictionary — create','https://www.oed.com/search/dictionary/?scope=Entries&q=create']],gtts:[['Create, Creation','https://www.churchofjesuschrist.org/study/scriptures/gs/create-creation?lang=eng']],bibleDictionary:[['Genesis','https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'],['God','https://www.churchofjesuschrist.org/study/scriptures/bd/god?lang=eng']],topicalGuide:[['Creation','https://www.churchofjesuschrist.org/study/scriptures/tg/creation?lang=eng'],['God, Creator','https://www.churchofjesuschrist.org/study/scriptures/tg/god-creator?lang=eng']],translations:true,research:{lds:[['Creation — Gospel Topics','https://www.churchofjesuschrist.org/study/manual/gospel-topics/creation?lang=eng'],['Joseph Smith Papers — search creation','https://www.josephsmithpapers.org/search?query=creation']],other:[['Blue Letter Bible — Genesis 1:1','https://www.blueletterbible.org/kjv/gen/1/1/'],['Webster 1828 — create','https://webstersdictionary1828.com/Dictionary/create']]}}};const d=data[key]||{};const links=items=>(items||[]).map(x=>`<div class="linkrow"><a href="${x[1]}" target="_blank">${x[0]}</a></div>`).join('');const sources=[];if(d.footnotes)sources.push(['Footnotes','footnotes']);if(d.language)sources.push(['Hebrew/Greek','language']);if(d.definitions?.length)sources.push(['Definitions','definitions']);if(d.gtts?.length)sources.push(['GTTS','gtts']);if(d.bibleDictionary?.length)sources.push(['Bible Dictionary','bd']);if(d.topicalGuide?.length)sources.push(['Topical Guide','tg']);if(d.translations)sources.push(['Translations','translations']);if((d.research?.lds?.length||0)+(d.research?.other?.length||0)>0)sources.push(['Research','research']);const tabs=document.getElementById('tabs'),panel=document.getElementById('panel');function renderPanel(id,label){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.id===id));let html='<h2>'+label+'</h2>';if(id==='footnotes')html+='<p>'+d.footnotes+'</p>';if(id==='language')html+=`<div class="hebrew">${d.language.he}</div><div class="translit"><strong>${d.language.tr}</strong> · ${d.language.strong}</div><p>${d.language.meaning}</p>`;if(id==='definitions')html+=links(d.definitions);if(id==='gtts')html+=links(d.gtts);if(id==='bd')html+=links(d.bibleDictionary);if(id==='tg')html+=links(d.topicalGuide);if(id==='translations')html+='<div class="linkrow"><strong>KJV</strong><span class="meta">default</span></div><div class="linkrow">ESV · NRSV · NIV · NLT · NKJV · NIrV <span class="meta">connectors pending</span></div>';if(id==='research')html+=`<div class="research-group"><h3>LDS Sources</h3>${links(d.research?.lds)}</div><div class="research-group"><h3>Other Sources</h3>${links(d.research?.other)}</div>`;panel.innerHTML=html}sources.forEach(([label,id],i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.dataset.id=id;b.textContent=label;b.onclick=()=>renderPanel(id,label);tabs.appendChild(b)});if(sources.length)renderPanel(sources[0][1],sources[0][0]);else panel.innerHTML='<div class="empty">No correlated study sources found for this selection yet.</div>';copyLink.onclick=async()=>{await navigator.clipboard.writeText(location.href);copyLink.textContent='Copied'};returnBtn.onclick=()=>st.url?location.href=st.url:history.back();</script></body></html>
