<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfbfa"><title>Study Companion</title><style>:root{--bg:#fbfbfa;--ink:#252525;--muted:#777;--line:#e7e7e3;--blue:#2f6f9f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:10;background:#fbfbfaf4;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:54px;padding:8px 14px}.back,.copy{border:0;background:none;color:var(--blue);font-size:16px;padding:8px 4px}.copy{margin-left:auto;font-size:14px}.title{margin-left:10px;font-weight:600;font-size:17px}.wrap{max-width:760px;margin:auto;padding:24px 22px 70px}.ref{font-size:15px;color:var(--blue);font-weight:600;margin-bottom:8px}.word{font:36px/1.08 Georgia,"Times New Roman",serif;margin:0 0 16px}.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 16px}.tab{border:1px solid var(--line);background:#fff;color:#444;border-radius:18px;padding:7px 11px;font-size:13px}.tab.active{background:#eaf2f8;border-color:#b9cfdf;color:#245d87;font-weight:600}.panel{border-top:1px solid var(--line);padding-top:20px;min-height:180px}.panel h2{font-size:13px;margin:0 0 12px}.panel h3{font:700 21px/1.25 Georgia,"Times New Roman",serif;margin:18px 0 9px}.panel p,.panel li{font:18px/1.55 Georgia,"Times New Roman",serif;margin:7px 0}.panel a{color:var(--blue);text-decoration:none}.hebrew{font:34px/1.2 "Times New Roman",serif;direction:rtl;text-align:left;margin:5px 0}.langlabel{font-size:12px;letter-spacing:.08em;font-weight:800}.translit{font:17px Georgia,serif}.sourcebox{border-left:2px solid #d7d7d2;padding:2px 0 2px 14px;margin:14px 0}.sourcebox .label{font-size:12px;font-weight:700}.sourcebox .source{font-size:12px;margin-top:7px}.definition{margin:14px 0}.definition .n{font-size:12px;color:var(--muted);font-weight:700}.usage div{font:16px/1.5 Georgia,"Times New Roman",serif;margin:4px 0}.linkrow,.translation{padding:11px 0;border-top:1px solid #eee}.translation .name{font-size:12px;font-weight:800}.translation .text{font:18px/1.55 Georgia,"Times New Roman",serif;margin-top:6px}.status,.empty,.meta{font-size:12px;color:var(--muted)}.research-group h3{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}@media(max-width:600px){.wrap{padding:20px 18px 60px}.word{font-size:34px}.panel p,.panel li,.translation .text{font-size:17px}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tab{width:100%;font-size:12px;padding:9px 8px}.tab:last-child:nth-child(odd){grid-column:1/-1}}</style></head><body><header class="top"><button class="back" id="returnBtn">‹ Gospel Library</button><div class="title">Study Companion</div><button class="copy" id="copyLink">Copy Link</button></header><main class="wrap"><div class="ref" id="referenceText">—</div><h1 class="word" id="selectedText">—</h1><div class="tabs" id="tabs"></div><section class="panel" id="panel"><div class="empty">Loading study sources…</div></section></main><script>
const STUDY_ENDPOINT='https://qgkexntrqccusjzxlmyg.supabase.co/functions/v1/study-lookup';
const SOURCE_INDEX_ENDPOINT='https://qgkexntrqccusjzxlmyg.supabase.co/functions/v1/source-index-lookup';
const TRANSLATION_ENDPOINT='https://qgkexntrqccusjzxlmyg.supabase.co/functions/v1/translation-lookup';
const q=new URLSearchParams(location.search),raw=(q.get('text')||q.get('input')||'').trim(),explicitRef=(q.get('ref')||'').trim();
const BOOKS='Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|1 Samuel|2 Samuel|1 Kings|2 Kings|1 Chronicles|2 Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|1 Corinthians|2 Corinthians|Galatians|Ephesians|Philippians|Colossians|1 Thessalonians|2 Thessalonians|1 Timothy|2 Timothy|Titus|Philemon|Hebrews|James|1 Peter|2 Peter|1 John|2 John|3 John|Jude|Revelation';
const R=new RegExp('\\b('+BOOKS+')\\s+(\\d+):(\\d+)','i');
function parse(input){let s=input.replace(/\u00a0/g,' ').trim(),url='';const ui=s.search(/https?:\/\//i);if(ui>=0){url=s.slice(ui).trim();s=s.slice(0,ui).trim()}let book='',chapter='',verse='',ref=explicitRef;let m=(ref||s).match(R);if(m){book=m[1];chapter=m[2];verse=m[3];ref=book+' '+chapter+':'+verse;s=s.replace(m[0],' ').trim()}if(!ref&&url){let u=url.match(/\/scriptures\/(?:ot|nt)\/([^/]+)\/(\d+).*?(?:id=p(\d+)|#p(\d+))/i);if(u){const map={gen:'Genesis',ex:'Exodus',lev:'Leviticus',num:'Numbers',deut:'Deuteronomy',matt:'Matthew',mark:'Mark',luke:'Luke',john:'John'};book=map[u[1].toLowerCase()]||u[1];chapter=u[2];verse=u[3]||u[4]||'';ref=book+' '+chapter+(verse?':'+verse:'')}}if(ref&&s){s=s.replace(new RegExp('^'+book.replace(/ /g,'\\s+')+'\\s+'+chapter+'\\s*[:.]?\\s*'+verse+'\\s*','i'),'').trim();s=s.replace(new RegExp('^'+book.replace(/ /g,'\\s+')+'\\s+'+chapter+verse+'\\s*','i'),'').trim()}return{text:s.replace(/^[-–—:;,.\s]+|[-–—:;,.\s]+$/g,'').replace(/\s+/g,' '),url,ref}}
const st=parse(raw),phrase=st.text.replace(/[“”"']/g,'').trim();referenceText.textContent=st.ref||'Reference not detected';selectedText.textContent=phrase||'No selection';
const labels={footnotes:'Footnotes',language:'Hebrew/Greek',definitions:'Definitions',gtts:'GTTS',bible_dictionary:'Bible Dictionary',topical_guide:'Topical Guide',research:'Research',translations:'Translations'};
let categories={}; const tabs=document.getElementById('tabs'),panel=document.getElementById('panel');
const a=(label,url)=>`<a href="${url}" target="_blank">${label}</a>`;
function sourceLink(row){return row.source_url?`<div class="source"><a href="${row.source_url}" target="_blank">Source: ${row.source_label||row.title||'Open source'} →</a></div>`:''}
function addCategory(id,row){if(!categories[id])categories[id]=[];const key=(row.source_key||row.source_url||JSON.stringify(row.payload||{}));if(!categories[id].some(x=>(x.source_key||x.source_url||JSON.stringify(x.payload||{}))===key))categories[id].push(row)}
function mergeSourceIndex(entries){for(const e of entries||[]){const c=e.content||{};if(e.source_type==='strongs'){addCategory('language',{source_key:e.source_key,source_label:e.metadata?.source_label||"Strong's",source_url:e.source_url,title:e.title,payload:{language:c.language,script:c.lemma,transliteration:c.transliteration,strong:c.strong,strong_definition:c.definition,kjv_renderings:(c.kjv_renderings||[]).join(', ')}})}else if(e.source_type==='gtts'){addCategory('gtts',{source_key:e.source_key,source_label:'Guide to the Scriptures',source_url:e.source_url,title:e.title,payload:{title:e.title,...c}})}else if(e.source_type==='topical_guide'){addCategory('topical_guide',{source_key:e.source_key,source_label:'Topical Guide',source_url:e.source_url,title:e.title,payload:{entries:[{label:e.title,url:e.source_url}]}})}else if(e.source_type==='bible_dictionary'){addCategory('bible_dictionary',{source_key:e.source_key,source_label:'Bible Dictionary',source_url:e.source_url,title:e.title,payload:{entries:[{label:e.title,url:e.source_url}],...c}})}else if(e.source_type==='research'){addCategory('research',{source_key:e.source_key,source_label:e.title,source_url:e.source_url,payload:c})}}}
function renderCategory(id){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.id===id));if(id==='translations'){renderTranslations();return}const rows=categories[id]||[];let html='<h2>'+labels[id]+'</h2>';if(!rows.length){panel.innerHTML=html+'<div class="empty">No correlated content found.</div>';return}for(const row of rows){const p=row.payload||{};if(id==='footnotes'){html+=`<p>${p.text||''}</p>`;(p.citations||[]).forEach(c=>html+=`<div class="sourcebox"><div class="label">${c.label}</div><p>${c.text||''}</p><div class="source">${a('Open '+c.label+' source →',c.url)}</div></div>`)}else if(id==='language'){html+=`<div class="langlabel"><strong>${p.language||''}</strong></div><div class="hebrew">${p.script||''}</div><div class="translit"><strong>${p.transliteration||''}</strong>${p.strong?' · '+p.strong:''}</div>${p.pronunciation?`<p><strong>Pronunciation:</strong> ${p.pronunciation}</p>`:''}${p.part_of_speech?`<p><strong>Part of speech:</strong> ${p.part_of_speech}</p>`:''}${p.root?`<p><strong>Root:</strong> ${p.root}</p>`:''}${p.strong_definition?`<h3>Strong’s Definition</h3><p>${p.strong_definition}</p>`:''}${p.kjv_renderings?`<h3>KJV Renderings</h3><p>${p.kjv_renderings}</p>`:''}${p.counts?`<div class="usage">${p.counts.map(x=>`<div><strong>${x[0]}</strong> — ${x[1]}</div>`).join('')}</div>`:''}${sourceLink(row)}`}
else if(id==='definitions'){if(p.webster1828){html+='<h3>Webster 1828</h3>'+p.webster1828.map((x,i)=>`<div class="definition"><div class="n">${i+1}</div><p>${x}</p></div>`).join('')}if(p.summary)html+=`<p>${p.summary}</p>`;html+=sourceLink(row)}
else if(id==='gtts'){html+=`<h3>${p.title||row.title||'Guide to the Scriptures'}</h3>`;if(p.see?.length)html+=`<p><em>See also</em> ${p.see.map(x=>a(x.label,x.url)).join('; ')}</p>`;if(p.intro)html+=`<p>${p.intro}</p>`;if(p.items?.length)html+=`<ul>${p.items.map(x=>`<li>${x.text} ${a(x.ref,x.url)}.</li>`).join('')}</ul>`;html+=sourceLink(row)}
else if(id==='topical_guide'||id==='bible_dictionary'){(p.entries||[]).forEach(x=>html+=`<div class="linkrow">${a(x.label,x.url)}</div>`);html+=sourceLink(row)}
else if(id==='research'){if(p.lds?.length)html+=`<div class="research-group"><h3>LDS Sources</h3>${p.lds.map(x=>`<div class="linkrow">${a(x.label,x.url)}</div>`).join('')}</div>`;if(p.other?.length)html+=`<div class="research-group"><h3>Other Sources</h3>${p.other.map(x=>`<div class="linkrow">${a(x.label,x.url)}</div>`).join('')}</div>`;if(!p.lds?.length&&!p.other?.length)html+=sourceLink(row)}}
panel.innerHTML=html}
async function renderTranslations(){panel.innerHTML='<h2>Translations</h2><div class="empty">Loading translations…</div>';try{const r=await fetch(TRANSLATION_ENDPOINT+'?ref='+encodeURIComponent(st.ref));const j=await r.json();panel.innerHTML='<h2>Translations</h2>'+j.translations.map(t=>`<div class="translation"><div class="name">${t.id}</div>${t.text?`<div class="text">${t.text}</div>`:`<div class="status">${({authorization_required:'Authorized source still required',permission_required:'Permission/source still required',credentials_required:'API credential not connected'})[t.status]||t.status}</div>`}</div>`).join('')}catch{panel.innerHTML='<h2>Translations</h2><div class="empty">Translation service could not be reached.</div>'}}
function buildTabs(){tabs.innerHTML='';const order=['footnotes','language','definitions','gtts','bible_dictionary','topical_guide','translations','research'];const ids=order.filter(id=>id==='translations'||(categories[id]&&categories[id].length));ids.forEach((id,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.dataset.id=id;b.textContent=labels[id];b.onclick=()=>renderCategory(id);tabs.appendChild(b)});if(ids.length)renderCategory(ids[0]);else panel.innerHTML='<div class="empty">No correlated study sources found yet.</div>'}
async function loadAll(){if(!st.ref||!phrase){panel.innerHTML='<div class="empty">Reference or selected word could not be detected.</div>';return}try{const [studyRes,indexRes]=await Promise.all([fetch(STUDY_ENDPOINT+'?ref='+encodeURIComponent(st.ref)+'&phrase='+encodeURIComponent(phrase)),fetch(SOURCE_INDEX_ENDPOINT+'?ref='+encodeURIComponent(st.ref)+'&phrase='+encodeURIComponent(phrase))]);const study=await studyRes.json();const index=await indexRes.json();categories=study.categories||{};mergeSourceIndex(index.entries||[]);buildTabs()}catch{categories={};buildTabs()}}
copyLink.onclick=async()=>{await navigator.clipboard.writeText(location.href);copyLink.textContent='Copied'};returnBtn.onclick=()=>st.url?location.href=st.url:history.back();loadAll();
</script></body></html>
