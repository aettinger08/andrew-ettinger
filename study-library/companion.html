<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfbfa"><title>Study Companion</title><style>:root{--bg:#fbfbfa;--ink:#252525;--muted:#767676;--line:#e5e5e2;--blue:#2f6f9f;--soft:#f5f5f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:10;background:#fbfbfaf4;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:54px;padding:8px 14px}.back{border:0;background:none;color:var(--blue);font-size:16px;padding:8px 4px;cursor:pointer}.title{margin-left:10px;font-weight:600;font-size:17px}.copy{margin-left:auto;border:0;background:none;color:var(--blue);font-size:14px}.wrap{max-width:760px;margin:auto;padding:24px 22px 70px}.ref{font-size:15px;color:var(--blue);font-weight:600;margin-bottom:8px}.word{font:36px/1.08 Georgia,"Times New Roman",serif;margin:0 0 24px}.section{border-top:1px solid var(--line);padding:20px 0}.section:first-of-type{border-top:0}.section h2{font-size:13px;letter-spacing:.01em;margin:0 0 12px;font-weight:700}.section p,.section li{font:18px/1.55 Georgia,"Times New Roman",serif;margin:7px 0}.section ul{padding-left:20px}.meta{font-size:12px;color:var(--muted);margin-top:6px}.hebrew{font:34px/1.2 "Times New Roman",serif;direction:rtl;text-align:left;margin:5px 0}.translit{font:17px Georgia,serif}.linkrow{padding:9px 0;border-top:1px solid #eeeeeb}.linkrow:first-child{border-top:0}.linkrow a,.section a{color:var(--blue);text-decoration:none}.linkrow a:hover,.section a:hover{text-decoration:underline}.source{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.quote{font:17px/1.55 Georgia,serif;margin:8px 0}.empty{font-size:14px;color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.research-group{margin-top:12px}.research-group h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}@media(max-width:600px){.wrap{padding:20px 18px 60px}.word{font-size:34px}.section p,.section li{font-size:17px}}</style></head><body><header class="top"><button class="back" id="returnBtn">‹ Gospel Library</button><div class="title">Study Companion</div><button class="copy" id="copyLink">Copy Link</button></header><main class="wrap"><div class="ref" id="referenceText">—</div><h1 class="word" id="selectedText">—</h1><section class="section"><h2>LDS Footnote / Cross-Reference</h2><div id="ldsArea"></div></section><section class="section"><h2>Original Language</h2><div id="languageArea"></div></section><section class="section"><h2>Definitions</h2><div id="definitionsArea"></div></section><section class="section"><h2>Guide to the Scriptures</h2><div id="guideArea"></div></section><section class="section"><h2>Bible Dictionary</h2><div id="bdArea"></div></section><section class="section"><h2>Topical Guide</h2><div id="tgArea"></div></section><section class="section"><h2>Bible Comparisons</h2><div id="compareArea"></div></section><section class="section"><h2>Research</h2><div id="researchArea"></div></section></main><script>const q=new URLSearchParams(location.search);const raw=(q.get('text')||q.get('input')||'').trim();const explicitRef=(q.get('ref')||'').trim();const BOOKS='Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|1 Samuel|2 Samuel|1 Kings|2 Kings|1 Chronicles|2 Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|1 Corinthians|2 Corinthians|Galatians|Ephesians|Philippians|Colossians|1 Thessalonians|2 Thessalonians|1 Timothy|2 Timothy|Titus|Philemon|Hebrews|James|1 Peter|2 Peter|1 John|2 John|3 John|Jude|Revelation';const R=new RegExp('\\b('+BOOKS+')\\s+(\\d+):(\\d+)','i');function parse(input){let s=input.replace(/\u00a0/g,' ').trim(),url='';const ui=s.search(/https?:\/\//i);if(ui>=0){url=s.slice(ui).trim();s=s.slice(0,ui).trim()}let book='',chapter='',verse='',ref=explicitRef;let m=(ref||s).match(R);if(m){book=m[1];chapter=m[2];verse=m[3];ref=book+' '+chapter+':'+verse;s=s.replace(m[0],' ').trim()}if(!ref&&url){let u=url.match(/\/scriptures\/(?:ot|nt)\/([^/]+)\/(\d+)[^#]*[?#&](?:id=)?p(\d+)/i)||url.match(/\/scriptures\/(?:ot|nt)\/([^/]+)\/(\d+).*?#p(\d+)/i);if(u){const map={gen:'Genesis',ex:'Exodus',lev:'Leviticus',num:'Numbers',deut:'Deuteronomy',matt:'Matthew',mark:'Mark',luke:'Luke',john:'John'};book=map[u[1].toLowerCase()]||u[1];chapter=u[2];verse=u[3];ref=book+' '+chapter+':'+verse}}if(ref&&s){s=s.replace(new RegExp('^'+book.replace(/ /g,'\\s+')+'\\s+'+chapter+'\\s*[:.]?\\s*'+verse+'\\s*','i'),'').trim();s=s.replace(new RegExp('^'+book.replace(/ /g,'\\s+')+'\\s+'+chapter+verse+'\\s*','i'),'').trim()}s=s.replace(/^[-–—:;,.\s]+|[-–—:;,.\s]+$/g,'').replace(/\s+/g,' ');return{text:s,url,ref}}const st=parse(raw);const phrase=st.text.replace(/[“”"']/g,'').trim();referenceText.textContent=st.ref||'Reference not detected';selectedText.textContent=phrase||'No selection';const key=st.ref+'|'+phrase.toLowerCase();const data={ 'Genesis 1:1|created':{footnote:`HEB shaped, fashioned, created; always divine activity; see <a href="https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?id=p1#p1" target="_blank">Abraham 4:1</a>, organized, formed. <a href="https://www.churchofjesuschrist.org/study/scriptures/tg/creation?lang=eng" target="_blank">TG Creation</a>; <a href="https://www.churchofjesuschrist.org/study/scriptures/tg/god-creator?lang=eng" target="_blank">TG God, Creator</a>.`,he:'בָּרָא',tr:'bārāʾ',strong:'H1254',meaning:'create, shape, form',guide:[['Create, Creation','https://www.churchofjesuschrist.org/study/scriptures/gs/create-creation?lang=eng']],bd:[['Genesis','https://www.churchofjesuschrist.org/study/scriptures/bd/genesis?lang=eng'],['God','https://www.churchofjesuschrist.org/study/scriptures/bd/god?lang=eng']],tg:[['Creation','https://www.churchofjesuschrist.org/study/scriptures/tg/creation?lang=eng'],['God, Creator','https://www.churchofjesuschrist.org/study/scriptures/tg/god-creator?lang=eng']],index:[['Creation, Create','https://www.churchofjesuschrist.org/study/scriptures/triple-index/creation?lang=eng']],researchLds:[['Creation — Gospel Topics','https://www.churchofjesuschrist.org/study/manual/gospel-topics/creation?lang=eng'],['Joseph Smith Papers — search Creation','https://www.josephsmithpapers.org/search?query=creation']],researchOther:[['Blue Letter Bible — Genesis 1:1','https://www.blueletterbible.org/kjv/gen/1/1/'],['Webster 1828 — create','https://webstersdictionary1828.com/Dictionary/create']]}};const d=data[key];ldsArea.innerHTML=d?'<p>'+d.footnote+'</p>':'<div class="empty">Exact official LDS data for this selection is not loaded yet.</div>';languageArea.innerHTML=d?`<div class="hebrew">${d.he}</div><div class="translit"><strong>${d.tr}</strong> · ${d.strong}</div><p>${d.meaning}</p>`:'<div class="empty">Original-language data is not loaded yet.</div>';definitionsArea.innerHTML=d?`<div class="linkrow"><a href="https://webstersdictionary1828.com/Dictionary/create" target="_blank">Webster 1828 — create</a></div><div class="linkrow"><a href="https://www.oed.com/search/dictionary/?scope=Entries&q=create" target="_blank">Oxford English Dictionary — create</a></div>`:'<div class="empty">Definitions will appear here when available.</div>';function links(items){return items&&items.length?items.map(x=>`<div class="linkrow"><a href="${x[1]}" target="_blank">${x[0]}</a></div>`).join(''):'<div class="empty">No directly correlated entry found for this selection.</div>'}guideArea.innerHTML=d?links(d.guide):links([]);bdArea.innerHTML=d?links(d.bd):links([]);tgArea.innerHTML=d?links(d.tg):links([]);compareArea.innerHTML=`<div class="linkrow"><strong>KJV</strong> <span class="meta">default</span></div><div class="linkrow">ESV · NRSV · NIV · NLT · NKJV · NIrV <span class="meta">comparison text connectors pending</span></div>`;researchArea.innerHTML=d?`<div class="research-group"><h3>LDS Sources</h3>${links(d.index)}${links(d.researchLds)}</div><div class="research-group"><h3>Non-LDS Sources</h3>${links(d.researchOther)}</div>`:'<div class="empty">Correlated LDS and non-LDS research links will appear here.</div>';copyLink.onclick=async()=>{await navigator.clipboard.writeText(location.href);copyLink.textContent='Copied'};returnBtn.onclick=()=>st.url?location.href=st.url:history.back();</script></body></html>
