<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbfbfa"><title>Study Companion</title><style>:root{--bg:#fbfbfa;--ink:#252525;--muted:#777;--line:#e7e7e3;--blue:#2f6f9f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:10;background:#fbfbfaf4;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:54px;padding:8px 14px}.back,.copy{border:0;background:none;color:var(--blue);font-size:16px;padding:8px 4px;cursor:pointer}.copy{margin-left:auto;font-size:14px}.title{margin-left:10px;font-weight:600;font-size:17px}.wrap{max-width:760px;margin:auto;padding:24px 22px 70px}.ref{font-size:15px;color:var(--blue);font-weight:600;margin-bottom:8px}.word{font:36px/1.08 Georgia,"Times New Roman",serif;margin:0 0 16px}.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 16px;margin-bottom:4px}.tab{border:1px solid var(--line);background:#fff;color:#444;border-radius:18px;padding:7px 11px;font-size:13px;cursor:pointer}.tab.active{background:#eaf2f8;border-color:#b9cfdf;color:#245d87;font-weight:600}.panel{border-top:1px solid var(--line);padding-top:20px;min-height:180px}.panel h2{font-size:13px;margin:0 0 12px}.panel h3{font-size:13px;margin:18px 0 7px}.panel p,.panel li{font:18px/1.55 Georgia,"Times New Roman",serif;margin:7px 0}.panel a{color:var(--blue);text-decoration:none}.panel a:hover{text-decoration:underline}.hebrew{font:34px/1.2 "Times New Roman",serif;direction:rtl;text-align:left;margin:5px 0}.langlabel{font-size:12px;letter-spacing:.08em;font-weight:800;margin-bottom:7px}.translit{font:17px Georgia,serif}.linkrow{padding:10px 0;border-top:1px solid #eeeeeb}.linkrow:first-child{border-top:0}.meta{font-size:12px;color:var(--muted);margin-left:6px}.empty{font-size:14px;color:var(--muted)}.sourcebox{border-left:2px solid #d7d7d2;padding:2px 0 2px 14px;margin:14px 0}.sourcebox .label{font-size:12px;font-weight:700;margin-bottom:4px}.sourcebox .source{font-size:12px;margin-top:7px}.sourcebox .kind{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}.readfull{display:inline-block;margin-top:7px;font-size:13px;font-weight:600}.definition{margin:14px 0}.definition .n{font-size:12px;color:var(--muted);font-weight:700}.usage{margin-top:14px}.usage div{font:16px/1.5 Georgia,"Times New Roman",serif;margin:4px 0}.research-group h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px}@media(max-width:600px){.wrap{padding:20px 18px 60px}.word{font-size:34px}.panel p,.panel li{font-size:17px}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tab{width:100%;font-size:12px;padding:9px 8px;text-align:center}.tab:last-child:nth-child(odd){grid-column:1/-1}}</style></head><body><header class="top"><button class="back" id="returnBtn">‹ Gospel Library</button><div class="title">Study Companion</div><button class="copy" id="copyLink">Copy Link</button></header><main class="wrap"><div class="ref" id="referenceText">—</div><h1 class="word" id="selectedText">—</h1><div class="tabs" id="tabs"></div><section class="panel" id="panel"><div class="empty">Choose a study source above.</div></section></main><script>const q=new URLSearchParams(location.search);const raw=(q.get('text')||q.get('input')||'').trim();const explicitRef=(q.get('ref')||'').trim();const BOOKS='Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|1 Samuel|2 Samuel|1 Kings|2 Kings|1 Chronicles|2 Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|1 Corinthians|2 Corinthians|Galatians|Ephesians|Philippians|Colossians|1 Thessalonians|2 Thessalonians|1 Timothy|2 Timothy|Titus|Philemon|Hebrews|James|1 Peter|2 Peter|1 John|2 John|3 John|Jude|Revelation';const R=new RegExp('\\b('+BOOKS+')\\s+(\\d+):(\\d+)','i');function parse(input){let s=input.replace(/\u00a0/g,' ').trim(),url='';const ui=s.search(/https?:\/\//i);if(ui>=0){url=s.slice(ui).trim();s=s.slice(0,ui).trim()}let book='',chapter='',verse='',ref=explicitRef;let m=(ref||s).match(R);if(m){book=m[1];chapter=m[2];verse=m[3];ref=book+' '+chapter+':'+verse;s=s.replace(m[0],' ').trim()}if(!ref&&url){let u=url.match(/\/scriptures\/(?:ot|nt)\/([^/]+)\/(\d+).*?(?:id=p(\d+)|#p(\d+))/i);if(u){const map={gen:'Genesis',ex:'Exodus',lev:'Leviticus',num:'Numbers',deut:'Deuteronomy',matt:'Matthew',mark:'Mark',luke:'Luke',john:'John'};book=map[u[1].toLowerCase()]||u[1];chapter=u[2];verse=u[3]||u[4]||'';ref=book+' '+chapter+(verse?':'+verse:'')}}if(ref&&s){s=s.replace(new RegExp('^'+book.replace(/ /g,'\\s+')+'\\s+'+chapter+'\\s*[:.]?\\s*'+verse+'\\s*','i'),'').trim();s=s.replace(new RegExp('^'+book.replace(/ /g,'\\s+')+'\\s+'+chapter+verse+'\\s*','i'),'').trim()}s=s.replace(/^[-–—:;,.\s]+|[-–—:;,.\s]+$/g,'').replace(/\s+/g,' ');return{text:s,url,ref}}const st=parse(raw);const phrase=st.text.replace(/[“”"']/g,'').trim();referenceText.textContent=st.ref||'Reference not detected';selectedText.textContent=phrase||'No selection';const key=st.ref+'|'+phrase.toLowerCase();const data={'Genesis 1:1|created':{footnote:`HEB shaped, fashioned, created; always divine activity; see Abraham 4:1, organized, formed. TG Creation; TG God, Creator.`,footnoteSources:[{label:'Abraham 4:1',kind:'Scripture',fullText:'1 And then the Lord said: Let us go down. And they went down at the beginning, and they, that is the Gods, organized and formed the heavens and the earth.',url:'https://www.churchofjesuschrist.org/study/scriptures/pgp/abr/4?id=p1#p1',fullInline:true}],language:{type:'HEBREW',he:'בָּרָא',tr:'bārāʾ',pron:'baw-raw',strong:'H1254',pos:'verb',root:'primitive root',strongDefinition:'(absolutely) to create; (qualified) to cut down (a wood), select, feed (as formative processes)',kjvRenderings:'choose, create (creator), cut down, dispatch, do, make (fat)',counts:[['create','42x'],['creator','3x'],['choose','2x'],['make','2x'],['cut down','2x'],['dispatch','1x'],['done','1x'],['make fat','1x']],sourceLabel:'Blue Letter Bible — Strong’s H1254',source:'https://www.blueletterbible.org/lexicon/h1254/kjv/wlc/0-1/'},webster:{title:'Webster 1828 — Create',url:'https://1828dictionary.com/word/create/',defs:['To produce; to bring into being from nothing; to cause to exist.','To make or form, by investing with a new character.','To produce; to cause; to be the occasion of.','To beget; to generate; to bring forth.','To make or produce by new combinations of matter already created; to shape and organize.','To form anew; to change the state or character; to renew.']},oxford:{summary:'Modern English uses create primarily for bringing something into existence or causing something new to result. See Oxford for its full licensed entry, etymology, and usage history.',url:'https://www.oed.com/search/dictionary/?scope=Entries&q=create'},gtts:{title:'Create, Creation',summary:'The Guide describes creation as God organizing the elements of nature through Jesus Christ to form the heavens and the earth, and creating humanity in Their image.',url:'https://www.churchofjesuschrist.org/study/scriptures/gs/create-creation?lang=eng'},topicalGuide:[['Creation','https://www.churchofjesuschrist.org/study/scriptures/tg/creation?lang=eng'],['God, Creator','https://www.churchofjesuschrist.org/study/scriptures/tg/god-creator?lang=eng']],translations:true,research:{lds:[['Creation — Gospel Topics','https://www.churchofjesuschrist.org/study/manual/gospel-topics/creation?lang=eng'],['Joseph Smith Papers — search creation','https://www.josephsmithpapers.org/search?query=creation']],other:[['Blue Letter Bible — Genesis 1:1','https://www.blueletterbible.org/kjv/gen/1/1/'],['Blue Letter Bible — H1254','https://www.blueletterbible.org/lexicon/h1254/kjv/wlc/0-1/']]}}};const d=data[key]||{};const links=items=>(items||[]).map(x=>`<div class="linkrow"><a href="${x[1]}" target="_blank">${x[0]}</a></div>`).join('');const sources=[];if(d.footnote)sources.push(['Footnotes','footnotes']);if(d.language)sources.push(['Hebrew/Greek','language']);if(d.webster||d.oxford)sources.push(['Definitions','definitions']);if(d.gtts)sources.push(['GTTS','gtts']);if(d.bibleDictionary?.length)sources.push(['Bible Dictionary','bd']);if(d.topicalGuide?.length)sources.push(['Topical Guide','tg']);if(d.translations)sources.push(['Translations','translations']);if((d.research?.lds?.length||0)+(d.research?.other?.length||0)>0)sources.push(['Research','research']);const tabs=document.getElementById('tabs'),panel=document.getElementById('panel');function renderCitation(s){let body=s.fullInline?`<p>${s.fullText}</p>`:`<p>${s.excerpt}</p>`;return `<div class="sourcebox"><div class="kind">${s.kind||''}</div><div class="label">${s.label}</div>${body}<div class="source"><a class="readfull" href="${s.url}" target="_blank">Open ${s.label} source →</a></div></div>`}function renderPanel(id,label){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.id===id));let html='<h2>'+label+'</h2>';if(id==='footnotes'){html+='<p>'+d.footnote+'</p>';(d.footnoteSources||[]).forEach(s=>html+=renderCitation(s))}if(id==='language'){const L=d.language;html+=`<div class="langlabel"><strong>${L.type}</strong></div><div class="hebrew">${L.he}</div><div class="translit"><strong>${L.tr}</strong> · ${L.strong}</div><p><strong>Pronunciation:</strong> ${L.pron}</p><p><strong>Part of speech:</strong> ${L.pos}</p><p><strong>Root:</strong> ${L.root}</p><h3>Strong’s Definition</h3><p>${L.strongDefinition}</p><h3>KJV Renderings</h3><p>${L.kjvRenderings}</p><div class="usage">${L.counts.map(x=>`<div><strong>${x[0]}</strong> — ${x[1]}</div>`).join('')}</div><div class="sourcebox"><div class="source"><a href="${L.source}" target="_blank">Source: ${L.sourceLabel}</a></div></div>`}if(id==='definitions'){if(d.webster){html+=`<h3>${d.webster.title}</h3>`;d.webster.defs.forEach((x,i)=>html+=`<div class="definition"><div class="n">${i+1}</div><p>${x}</p></div>`);html+=`<div class="sourcebox"><div class="source"><a href="${d.webster.url}" target="_blank">Source: Webster 1828</a></div></div>`}if(d.oxford){html+=`<h3>Oxford English Dictionary</h3><p>${d.oxford.summary}</p><div class="sourcebox"><div class="source"><a href="${d.oxford.url}" target="_blank">Source: Oxford English Dictionary</a></div></div>`}}if(id==='gtts'){html+=`<h3>${d.gtts.title}</h3><p>${d.gtts.summary}</p><div class="sourcebox"><div class="source"><a href="${d.gtts.url}" target="_blank">Read full Guide to the Scriptures entry →</a></div></div>`}if(id==='bd')html+=links(d.bibleDictionary);if(id==='tg')html+=links(d.topicalGuide);if(id==='translations')html+='<div class="linkrow"><strong>KJV</strong><span class="meta">default</span></div><div class="linkrow">ESV · NRSV · NIV · NLT · NKJV · NIrV <span class="meta">connectors pending</span></div>';if(id==='research')html+=`<div class="research-group"><h3>LDS Sources</h3>${links(d.research?.lds)}</div><div class="research-group"><h3>Other Sources</h3>${links(d.research?.other)}</div>`;panel.innerHTML=html}sources.forEach(([label,id],i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.dataset.id=id;b.textContent=label;b.onclick=()=>renderPanel(id,label);tabs.appendChild(b)});if(sources.length)renderPanel(sources[0][1],sources[0][0]);else panel.innerHTML='<div class="empty">No correlated study sources found for this selection yet.</div>';copyLink.onclick=async()=>{await navigator.clipboard.writeText(location.href);copyLink.textContent='Copied'};returnBtn.onclick=()=>st.url?location.href=st.url:history.back();</script></body></html>
